name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # No services and no secrets. `next build` was verified to complete with the
    # environment entirely empty: every variable this app reads is consumed at request
    # time, not at build time, so CI needs none of them. A build step that quietly
    # required a secret would be a build step nobody could reproduce locally.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches Voone-backend_service, so a developer moving between the two repos is
      # never debugging a version difference.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, so CI installs exactly what the lockfile pins and a dependency cannot
      # drift in without a diff. This needed the lockfile to be regenerated on Linux
      # first: npm writes one for the platform it runs on, and the previous file was
      # generated on darwin-arm64, which omits the top-level @emnapi/core and
      # @emnapi/runtime entries that linux-x64 hoists for Tailwind's oxide and eslint's
      # unrs-resolver wasm fallbacks. `npm ci` refused on every Linux machine as a
      # result, and regenerating on macOS could not fix it — those entries are simply
      # not produced there, `--os=linux --cpu=x64` included.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # `next typegen` runs first, inside the script. PageProps and the typed-route table
      # are generated by Next, so a bare tsc on a fresh checkout fails on four route
      # files that are correct — which is exactly the false alarm that sent someone
      # hunting through the admin panel for a bug that was not there.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
