name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # No services and no secrets. `next build` was verified to complete with the
    # environment entirely empty: every variable this app reads is consumed at request
    # time, not at build time, so CI needs none of them. A build step that quietly
    # required a secret would be a build step nobody could reproduce locally.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches Voone-backend_service, so a developer moving between the two repos is
      # never debugging a version difference.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, and that is a known compromise rather than an
      # oversight.
      #
      # npm writes a lockfile for the platform it runs on, and this one is generated on
      # darwin-arm64. Tailwind 4's oxide and eslint's unrs-resolver both carry
      # wasm32-wasi fallbacks whose @emnapi/core and @emnapi/runtime dependencies npm
      # hoists on linux-x64 but not on macOS — so `npm ci` refuses on every Linux
      # machine, including every developer's container. Regenerating on macOS does not
      # fix it; the entries simply are not produced there.
      #
      # The cost is that CI no longer enforces the lockfile exactly. The fix is to
      # regenerate it once on Linux and switch back, tracked as its own task rather than
      # smuggled into a commit about CI.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # `next typegen` runs first, inside the script. PageProps and the typed-route table
      # are generated by Next, so a bare tsc on a fresh checkout fails on four route
      # files that are correct — which is exactly the false alarm that sent someone
      # hunting through the admin panel for a bug that was not there.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
